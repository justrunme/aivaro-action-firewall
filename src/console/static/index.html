<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JustRunMe Console</title>
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="logo" aria-hidden="true">&#9654;</span>
      <div>
        <div class="name">JustRunMe <span class="zero">Zero</span></div>
        <div class="tag">Rehearse. Run. Recover.</div>
      </div>
    </div>
    <nav class="tabs" aria-label="Screens">
      <a href="#/missions" data-screen="missions">Missions</a>
      <a href="#/impact" data-screen="impact">Impact Diff</a>
      <a href="#/approvals" data-screen="approvals">Approval Center</a>
      <a href="#/recovery" data-screen="recovery">Recovery &amp; Replay</a>
    </nav>
    <div class="chainstate" id="chainstate" aria-live="polite"></div>
  </header>
  <main id="view" tabindex="-1">
    <p class="muted">Loading&hellip;</p>
  </main>
  <footer class="foot">
    Local console on 127.0.0.1. Everything shown is read from the signed receipt chain and the plan history; approvals go through the <code>justrunme approve</code> command.
  </footer>
</body>
</html>
